server:
  port: 60000

spring:
  application:
    name: user-service
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  config: # 이 파일은 application.yml보다 먼저 메모리에 로딩된다.(우선 순위가 높다)
    import:  "optional:configserver:http://127.0.0.1:8888"
  cloud:
    config:
      name: ecommerce #ecommerce.yml에서 가져올꺼다
      profile: default
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: user
      password: $2a$10$kn3jSKRXmhrj16Aru7Fi4..VJjZaDmjG3.XwMA1IPoZXAXbrPzsuq

eureka:
  instance:
    instance-id: 127.0.0.1:${spring.application.name}:${server.port}  # 변경!
    prefer-ip-address: true
    ip-address: 127.0.0.1  # 추가!
    non-secure-port: 60000
    hostname: 127.0.0.1
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    fetch-registry: true
    register-with-eureka: true

greeting:
  message: Welcome to the Simple E-commerce

#액츄에이터에서 사용
management:
  endpoints:
    web:
      exposure:
        include: refresh,health,beans,info,busrefresh